version: '3.8'

services:
  web:
    build:
      context: ..
      dockerfile: Docker/Dockerfile
    ports:
      - "8080:80"
    volumes:
      - ../public:/var/www/html
      - ../data:/var/www/data
      - ../apache.conf:/etc/apache2/sites-available/000-default.conf
    container_name: expense-reports
